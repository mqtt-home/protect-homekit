<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090B0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kameras" />
    <title>Kameras</title>
    <script>
      // Before first paint, so a dark-mode phone never flashes white.
      // The Wall Display app (wall-display2) sets data-embed before any script
      // runs; older builds only identify through the user agent.
      var root = document.documentElement
      if (!root.dataset.embed && / WallDisplay\//.test(navigator.userAgent)) root.dataset.embed = 'wall-display'
      var embedded = root.dataset.embed === 'wall-display'
      // Embedded in the panel: always dark, it draws a dark gradient behind us.
      var dark = embedded || matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
